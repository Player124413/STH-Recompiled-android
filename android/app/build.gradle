plugins {
    id "com.android.application"
}

// SDL3, at the version the SDK's Windows build uses: its Java side goes into the APK, its C side into libSDL3.so
def sdlDir = file("../third_party/SDL")
def sdlTag = "release-3.4.16"  // the version the SDK's Windows build uses
tasks.register("fetchSDL") {
    onlyIf { !new File(sdlDir, "CMakeLists.txt").exists() }
    doLast {
        exec {
            commandLine "git", "clone", "--depth", "1", "--branch", sdlTag, "https://github.com/libsdl-org/SDL.git",
                        sdlDir.absolutePath
        }
    }
}
preBuild.dependsOn "fetchSDL"

android {
    namespace "com.sthrecompiled.shadow"
    compileSdk 34
    // -PshadowNdk=<version>: a CI image's NDK, when it is not the one the port is developed against
    ndkVersion project.hasProperty("shadowNdk") ? project.shadowNdk : "28.2.13676358"

    defaultConfig {
        applicationId "com.sthrecompiled.shadow"
        minSdk 29
        targetSdk 34
        // -PversionCode=<n> -PversionName=<name>: the release workflow sets them from the tag
        versionCode project.hasProperty("versionCode") ? project.versionCode.toInteger() : 1
        versionName project.hasProperty("versionName") ? project.versionName : "1.0"
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                // -PxbeGenerated=<dir> -PxbeImage=<file>: recompiled code from somewhere else than generated/game
                if (project.hasProperty("xbeGenerated")) arguments "-DXBE_GENERATED=${project.xbeGenerated}"
                if (project.hasProperty("xbeImage")) arguments "-DXBE_IMAGE=${project.xbeImage}"
            }
        }
    }

    // the release key from SHADOW_KEYSTORE (a .jks path) and its passwords
    def keystore = System.getenv("SHADOW_KEYSTORE")
    signingConfigs {
        if (keystore) {
            release {
                storeFile file(keystore)
                storePassword System.getenv("SHADOW_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SHADOW_KEY_ALIAS")
                keyPassword System.getenv("SHADOW_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // without the release key a debug signature, so the release APK installs as it is
            signingConfig keystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            // the recompiled code is far too slow unoptimized
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "../CMakeLists.txt"
            // -PshadowCmake=<version>: the same for CMake
            version project.hasProperty("shadowCmake") ? project.shadowCmake : "3.31.6"
        }
    }

    sourceSets {
        main {
            java.srcDirs += new File(sdlDir, "android-project/app/src/main/java")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
