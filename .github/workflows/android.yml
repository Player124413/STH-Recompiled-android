# Builds the Android APK.
#
# Two shapes of build:
#   * shell  - no game code: tools/android/make_stub_game.py writes a stand-in for the recompiler's output. The APK
#              builds, installs and stops at "game not found". This is what proves the toolchain, the SDK runtime, the
#              renderer, ImGui and the Java side all build, before a disc image is involved.
#   * full   - with the player's own disc image: it is downloaded from the URL given to the run (or the repository
#              variable SHADOW_ISO_URL), default.xbe is read out of it, the SDK's recompiler (built here on Linux)
#              turns it into generated/game, and the APK is built from that.
#
# The disc image and the recompiled code it produces are never committed, cached or kept: the image goes away with the
# runner and the APK artifact is kept for a few days. Only the player's own game is ever built.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: "direct link to your own USA disc image (.iso); empty builds a shell APK"
        required: false
        default: ""
  push:
    paths:
      - "android/**"
      - "native/**"
      - "src/**"
      - "sdk/**"
      - "config/game.toml"
      - "tools/android/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: ${{ (inputs.iso_url || vars.SHADOW_ISO_URL) && 'APK (with the game)' || 'APK (shell, no game)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      checks: write
    env:
      NDK_VERSION: 28.2.13676358
      CMAKE_VERSION: 3.31.6
      ISO_URL: ${{ inputs.iso_url || vars.SHADOW_ISO_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already carries the Android SDK and its licences: use that and add what it may lack, rather
      # than reinstalling the SDK
      - name: NDK and CMake
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?no Android SDK on this runner}}"
          echo "SDK at $SDK"
          command -v sdkmanager > /dev/null || export PATH="$(ls -d "$SDK"/cmdline-tools/*/bin | head -1):$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" \
            "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /tmp/sdk.log 2>&1 \
            || { tail -20 /tmp/sdk.log; echo "::warning::pinned NDK/CMake not installable, using what the image has"; }
          NDK=$( (ls "$SDK/ndk" 2>/dev/null | grep -x "${NDK_VERSION}") || ls "$SDK/ndk" 2>/dev/null | sort -V | tail -1)
          CMAKE=$( (ls "$SDK/cmake" 2>/dev/null | grep -x "${CMAKE_VERSION}") || ls "$SDK/cmake" 2>/dev/null | sort -V | tail -1)
          test -n "$NDK" -a -n "$CMAKE" || { echo "::error::no NDK or CMake in $SDK"; ls -l "$SDK"; exit 1; }
          echo "NDK $NDK, CMake $CMAKE"
          { echo "NDK \`$NDK\`, CMake \`$CMAKE\`, SDK \`${SDK##*/}\`"; } >> "$GITHUB_STEP_SUMMARY"
          echo "SHADOW_NDK=$NDK" >> "$GITHUB_ENV"
          echo "SHADOW_CMAKE=$CMAKE" >> "$GITHUB_ENV"

      - name: Cache Gradle and SDL3
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/third_party/SDL
          key: android-${{ runner.os }}-${{ hashFiles('android/app/build.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-${{ runner.os }}-

      # ---- the game, when the run has one

      - name: Where the game comes from
        run: |
          if [ -n "${ISO_URL}" ]; then
            echo "a disc image will be used (the link is not printed: it is the player's own copy)"
          else
            echo "no disc image: this build is a shell APK (it installs and starts, and stops at 'game not found')"
            echo "to build a playable one: run this workflow with iso_url set, or set the repository variable SHADOW_ISO_URL"
          fi

      - name: Read default.xbe out of the disc image
        if: env.ISO_URL != ''
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 5 -o /tmp/game.iso "${ISO_URL}"
          ls -l /tmp/game.iso
          python3 -I tools/host/xiso.py extract /tmp/game.iso /tmp/xiso default.xbe
          test -s /tmp/xiso/default.xbe
          mkdir -p assets
          cp /tmp/xiso/default.xbe assets/default.xbe
          ls -l assets/default.xbe
          rm -f /tmp/game.iso

      - name: Recompile the game
        if: env.ISO_URL != ''
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
          { cmake -S tools/android/xbe_recomp -B out/tools -G Ninja -DCMAKE_BUILD_TYPE=Release &&
            cmake --build out/tools --target xbe_recomp -j "$(nproc)" &&
            ./out/tools/xbe_recomp config/game.toml --xdk sdk/xdk; } 2>&1 | tee /tmp/recomp.log
          st=${PIPESTATUS[0]}
          if [ $st -ne 0 ]; then python3 tools/android/ci_report.py /tmp/recomp.log; exit $st; fi
          ls generated/game | head
          test -f generated/game/x86_func_mapping.cpp

      - name: Stand-in for the game's code (shell build)
        if: env.ISO_URL == ''
        run: |
          set -euo pipefail
          python3 tools/android/make_stub_game.py
          ls generated/game

      # ---- the APK

      # Through a log file: a failure then comes back as annotations (tools/android/ci_report.py), which can be read
      # without opening the run
      - name: Build the APK
        working-directory: android
        run: |
          set -uo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --console=plain assembleDebug \
            -PshadowNdk="$SHADOW_NDK" -PshadowCmake="$SHADOW_CMAKE" 2>&1 | tee /tmp/build.log
          st=${PIPESTATUS[0]}
          if [ $st -ne 0 ]; then python3 ../tools/android/ci_report.py /tmp/build.log; fi
          exit $st

      - name: Report the failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          {
            echo "NDK ${SHADOW_NDK:-?}, CMake ${SHADOW_CMAKE:-?}, $(java -version 2>&1 | head -1)"
            for f in /tmp/sdk.log /tmp/recomp.log /tmp/build.log; do
              [ -s "$f" ] && { echo; echo "== $f"; python3 tools/android/ci_report.py "$f" --plain; }
            done
          } > /tmp/digest.txt
          tail -c 3000 /tmp/digest.txt
          python3 tools/android/ci_report.py /tmp/build.log || true
          python3 - "$GITHUB_SHA" > /tmp/checkrun.json <<'PY'
          import json, sys
          body = open("/tmp/digest.txt", errors="replace").read()[:60000] or "(nothing)"
          print(json.dumps({"name": "ci-report", "head_sha": sys.argv[1], "status": "completed",
                            "conclusion": "neutral",
                            "output": {"title": "why the APK build failed", "summary": body}}))
          PY
          gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" --input /tmp/checkrun.json > /dev/null \
            && echo "report posted" || echo "::warning::could not post the report"

      - name: What was built
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          ls -l "$APK"
          echo "### APK: $(basename "$APK"), $(du -h "$APK" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${ISO_URL}" ]; then
            echo "built with the game: playable" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "shell build: no game code in it, it stops at 'game not found'" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: shadow-android-${{ env.ISO_URL != '' && 'game' || 'shell' }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
